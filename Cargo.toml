[package]
name = "sov-redteam"
version = "0.1.1"
edition = "2021"
description = "Standalone adversarial red-team harness: throws theoretical attacks (timewarp, forgery, post-quantum, low-hashpower reorg, foreign-chain injection, supply) at the real SOV consensus code and reports which defenses held."
license = "Apache-2.0"
repository = "https://github.com/cloudzombie/sov-redteam"

# Standalone: this crate is its own workspace root, NOT a member of the sov
# monorepo's `chain/` workspace. The consensus crates it attacks are pulled from
# the public SOV repository as git dependencies, so the harness always runs
# against the SAME code a node runs — never a vendored copy that can drift.
#
# Two crates ship from here: this one is the ENGINE (library) plus the CLI, and
# `gui/` is the desktop application. The GUI links the engine as a path
# dependency, so both front ends run byte-for-byte the same attacks.
[workspace]
members = ["gui"]

[[bin]]
name = "sov-redteam"
path = "src/main.rs"

[dependencies]
# The real consensus. `branch = "main"` so the harness tracks released chain code;
# Cargo.lock (committed) pins the exact revision every build and every release tag
# is cut against, so a run is reproducible and a bump is a visible commit.
sov-primitives = { git = "https://github.com/cloudzombie/sov", branch = "main" }
sov-crypto = { git = "https://github.com/cloudzombie/sov", branch = "main" }
sov-types = { git = "https://github.com/cloudzombie/sov", branch = "main" }
# Constructing the full Action surface for the Gauntlet's exhaustive steal-the-pot
# sweep: `IntentSettle` carries a `sov_intents::Settlement`, `TokenSetPolicy` a
# `sov_compliance::CompliancePolicy`. These are the exact types the Action enum names.
sov-intents = { git = "https://github.com/cloudzombie/sov", branch = "main" }
sov-compliance = { git = "https://github.com/cloudzombie/sov", branch = "main" }
sov-state = { git = "https://github.com/cloudzombie/sov", branch = "main" }
sov-mining = { git = "https://github.com/cloudzombie/sov", branch = "main" }
sov-verify = { git = "https://github.com/cloudzombie/sov", branch = "main" }
sov-chain = { git = "https://github.com/cloudzombie/sov", branch = "main" }
# Live-fire front-door probe: talk to a REAL running node over JSON-RPC. `sov-rpc`
# ships a std-only HTTP client (no extra transport deps), so this stays lightweight.
sov-rpc = { git = "https://github.com/cloudzombie/sov", branch = "main" }
# Live-fire BACK-DOOR probe: join the P2P network as a real (hostile) peer and
# gossip forged blocks/txs over the encrypted Noise-XX + ML-KEM wire.
sov-network = { git = "https://github.com/cloudzombie/sov", branch = "main" }
# Funded-adversary probe: derive the REAL funded keypair from a mnemonic (BIP-39 +
# SLIP-0010, the same derivation sov-station uses) or a raw hex seed.
sov-wallet = { git = "https://github.com/cloudzombie/sov", branch = "main" }
hex = "0.4"
serde_json = "1"

[dev-dependencies]
# The Gauntlet's live probe talks JSON-RPC to a real node. For CI (no mainnet), an
# integration test boots an in-process `sov-node` behind `sov-rpc`'s server, funds a
# pot-like account, and runs `probe_gauntlet` against it — real RPC, real rejection.
sov-node = { git = "https://github.com/cloudzombie/sov", branch = "main" }

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
strip = true
