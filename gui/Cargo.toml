[package]
name = "sov-redteam-gui"
version = "0.2.0"
edition = "2021"
license = "Apache-2.0"
publish = false
description = "SOV Red Team — a STANDALONE desktop application for the adversarial harness. Separate from the wallet/daemon; reuses the sov-redteam engine library."

[[bin]]
name = "sov-redteam-gui"
path = "src/main.rs"

[dependencies]
eframe = "0.29"
# The engine crate in this same repo — the GUI runs the EXACT attacks the CLI
# runs (`run_all()` and the live probes), never a second implementation.
sov-redteam = { path = ".." }
# Reconstruct the funded keypair from the seed the operator pastes (held in memory
# only). Same git source as the engine's chain deps, so there is one `sov-crypto`.
sov-crypto = { git = "https://github.com/cloudzombie/sov", branch = "main" }
# Wipe the pasted secret + derived seed from memory when done.
zeroize = "1"
